  <body>
    <noscript>You need to turn on JavaScript to run Adhan Home.</noscript>
    <div id="root"></div>
    <script>
      // After an update, a page that was already open can ask for a file from the old version.
      // If a screen fails to load that way, load the page again once to pick up the new version.
      (function () {
        function stale(m) {
          return /AsyncRequireError|Loading module .* failed|dynamically imported module|ChunkLoadError/i.test(String(m || ''));
        }
        function again() {
          try {
            var t = Number(sessionStorage.getItem('ah-reloaded')) || 0;
            if (Date.now() - t < 30000) return;
            sessionStorage.setItem('ah-reloaded', String(Date.now()));
          } catch (e) {}
          location.reload();
        }
        window.addEventListener('error', function (e) {
          if (stale(e.message || (e.error && (e.error.name + ' ' + e.error.message)))) again();
        });
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason;
          if (stale(r && (r.name + ' ' + r.message))) again();
        });
      })();
      // Install support: register the service worker on real web hosts only.
      if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claudeusercontent|claude\.ai/.test(location.host)) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/adhan-home-app/sw.js', { scope: '/adhan-home-app/' }).catch(function () {});
        });
      }
      // Remember the install prompt until the app asks for it.
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__ahInstall = e;
        window.dispatchEvent(new Event('ah-installable'));
      });
    </script>
