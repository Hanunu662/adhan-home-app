<!doctype html><html><head><meta charset="utf-8"><title>Voice speed check</title></head><body style="font:16px system-ui;padding:20px"><h3>Voice speed check</h3><pre id="log">starting…</pre><script type="module">
const el = document.getElementById('log'); el.textContent = '';
const log = (...a) => { el.textContent += a.join(' ') + '\n'; };
const BASE = new URL('./', location.href).href;
const HF = 'https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/main/';
const pf = window.fetch.bind(window);
window.fetch = async (u, o) => { const s = typeof u === 'string' ? u : u.url; if (s.startsWith(HF)) { const rest = s.slice(HF.length); const r = await pf(rest.startsWith('voices/') ? BASE + rest : BASE + 'model/' + rest, o); if (r.ok) return r; } return pf(u, o); };
const text = 'Long before the Prophet, peace be upon him, was born, Prophet Ibrahim came to a dry valley between the mountains of the Hijaz with his wife Hajar.';
const m = await import(BASE + 'kokoro.js');
m.env.backends.onnx.wasm.wasmPaths = BASE + 'ort/';
log('cores', navigator.hardwareConcurrency, 'webgpu', !!navigator.gpu);
for (const [device, dtype] of [['webgpu', 'q8'], ['wasm', 'q8']]) {
  try {
    if (device === 'webgpu' && !(navigator.gpu && await navigator.gpu.requestAdapter())) { log('webgpu: no adapter'); continue; }
    const t0 = performance.now();
    const tts = await m.KokoroTTS.from_pretrained('onnx-community/Kokoro-82M-v1.0-ONNX', { dtype, device });
    log(device, dtype, 'loaded ms', Math.round(performance.now() - t0));
    for (let i = 0; i < 3; i++) {
      const t1 = performance.now();
      const out = await tts.generate(text, { voice: 'am_michael' });
      const ms = performance.now() - t1, secs = out.audio.length / out.sampling_rate;
      let peak = 0; for (const x of out.audio) peak = Math.max(peak, Math.abs(x));
      log(device, dtype, 'run', i, 'make ms', Math.round(ms), 'audio s', secs.toFixed(1), 'speed x', (secs * 1000 / ms).toFixed(2), 'peak', peak.toFixed(2));
    }
  } catch (e) { log(device, dtype, 'ERR', String(e && e.message || e).slice(0, 300)); }
}
log('DONE');
</script></body></html>
